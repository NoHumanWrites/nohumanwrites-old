name: test
on: [push, pull_request]
jobs:
  ledger:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: ssh -V
      - run: python3 -m py_compile nohumanwrites.py cli.py nhw/*.py
      - run: python3 tests/test_ledger.py
      - run: python3 tests/test_creative.py
      - run: python3 tests/test_web.py
      - run: python3 nohumanwrites.py check . --json > /dev/null
